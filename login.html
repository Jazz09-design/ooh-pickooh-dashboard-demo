<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk Dashboard</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f6f7fb;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:520px;background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:28px;}
    h1{margin:0 0 18px;font-size:28px;color:#123;}
    .field{display:flex;gap:12px;align-items:center;border:1px solid #e3e6ef;border-radius:12px;padding:12px 14px;margin:10px 0;}
    .field input{border:0;outline:0;flex:1;font-size:16px;}
    .btn{width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:16px;background:#2b6cff;color:#fff;cursor:pointer;margin-top:10px;}
    .muted{color:#667; font-size:14px; margin-top:12px; text-align:center;}
    .error{color:#b00020; font-size:14px; margin-top:10px; display:none;}
    a{color:#2b6cff;text-decoration:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Masuk ke Dashboard</h1>
      <form id="loginForm">
        <div class="field">
          <span>📧</span>
          <input id="email" type="email" placeholder="Email" autocomplete="username" required />
        </div>
        <div class="field">
          <span>🔒</span>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">Masuk</button>
        <div id="err" class="error"></div>
      </form>

      <div class="muted">Demo read-only? <a href="#" id="demoLink">Lihat Demo</a></div>
</code></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');

    function showErr(msg){ err.textContent = msg; err.style.display='block'; }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      err.style.display='none';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = window.Auth?.login(email, password);
      if (!res || !res.ok) return showErr(res?.error || 'Gagal login.');

      // Penting: role diset dari USERS mapping di auth.js
      window.location.href = 'dashboard.html';
    });

    document.getElementById('demoLink').addEventListener('click', (e) => {
      e.preventDefault();
      window.OMA_AUTH?.enterDemo();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
